[project]
name = "vault-rag"
version = "0.1.0"
description = "Graph-expanded hybrid RAG with a Jev relevance gate over an Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mcp>=2.3.0",
    "networkx>=3.6.1",
    "openai>=3.35.1",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "streamlit>=1.66.1",
    "torch>=2.14.1,<2.15",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# Linux (the Docker image) takes CPU-only torch; the default PyPI wheel pulls ~3 GB of CUDA
# libraries the home server cannot use. macOS keeps the PyPI wheel (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
