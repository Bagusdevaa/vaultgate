[project]
name = "vault-rag"
version = "0.1.0"
description = "Graph-expanded hybrid RAG with a Jev relevance gate over an Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "flagembedding>=1.4.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "networkx>=3.6.1",
    "openai>=3.35.1",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
